<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0a0a0a"/>
  <!-- Mouth silhouette -->
  <ellipse cx="300" cy="200" rx="80" ry="50" fill="none" stroke="#2DD4A8" stroke-width="2.5"/>
  <ellipse cx="300" cy="200" rx="60" ry="35" fill="none" stroke="#2DD4A8" stroke-width="1.5" opacity="0.5"/>
  <path d="M300 150 L300 250" stroke="#2DD4A8" stroke-width="1" opacity="0.3"/>
  <path d="M240 200 L360 200" stroke="#2DD4A8" stroke-width="1" opacity="0.3"/>
  <!-- CCW arrows -->
  <path d="M220 140 Q200 110 230 90 Q260 70 280 100" fill="none" stroke="#2DD4A8" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2DD4A8"/>
    </marker>
  </defs>
  <text x="300" y="290" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="18" fill="#2DD4A8" letter-spacing="3">MYOBRACE CCW</text>
  <text x="300" y="315" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6b6b6b" letter-spacing="2">Giro Antihorario</text>
</svg>